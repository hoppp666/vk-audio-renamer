name: Rename VK Audio

on:
  workflow_dispatch: # Оставляем возможность запускать вручную кнопкой
  schedule:
    - cron: '0 9 * * *' # Автоматический запуск каждый день в 12:00 по МСК

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Скачиваем код
        uses: actions/checkout@v4

      - name: Устанавливаем Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Устанавливаем библиотеки
        run: pip install -r requirements.txt

      - name: Запускаем переименование
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
        run: python rename_audio.py
